services:
  mysql-db:
    image: mysql:8.0
    container_name: grocery_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_grocery}
      MYSQL_USER: ${MYSQL_USER:-grocery_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-grocery_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - grocery-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grocery_backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-smart_grocery}
      DB_USERNAME: ${MYSQL_USER:-grocery_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-grocery_local_password}
      SERVER_PORT: 8080
      GROCERY_JWT_SECRET: ${GROCERY_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - grocery-network

volumes:
  mysql_data:

networks:
  grocery-network:
    driver: bridge
