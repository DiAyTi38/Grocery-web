name: Smart Grocery CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ==========================================
  # 1. KIỂM TRA BACKEND (SPRING BOOT & MYSQL)
  # ==========================================
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: smart_grocery
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Run Tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: smart_grocery
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw test -B

  # ==========================================
  # 2. KIỂM TRA FRONTEND (REACT / VITE)
  # ==========================================
  frontend-check:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Production Assets
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: |
          cd frontend
          npm run build

  # ==========================================
  # 3. KIỂM TRA AI SERVICE (FASTAPI / PYTHON)
  # ==========================================
  ai-service-check:
    name: AI Service Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax & Model Loading
        run: |
          cd ai-service
          python -m py_compile src/main.py src/predictor.py src/schemas.py
          python -c "from src.main import app; print('✅ FastAPI App & Model loaded successfully!')"
